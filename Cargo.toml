[workspace]
resolver = "2"
members = ["aria", "aria-avatar", "aria-build", "aria-protocol", "aria-ui"]
# The vendored msedge-tts is a patched dependency, not one of our crates.
exclude = ["vendor/msedge-tts"]

# One version (and one base feature set) per shared dependency. Crates add features on top.
[workspace.dependencies]
aria-build = { path = "aria-build" }
aria-protocol = { path = "aria-protocol" }
aria-ui = { path = "aria-ui" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"
slint = { version = "1.18", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-femtovg",
  "compat-1-18",
  "unstable-winit-030",
] }
slint-build = "1.18"

[profile.dev]
opt-level = 1
# Usable backtraces, far less debug info to write on Windows.
debug = "line-tables-only"

# Dependencies (Bevy especially) need optimisation to run smoothly even in dev builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The app crate is light glue, and the UI crate is generated Slint code. Optimising either bought
# nothing at runtime but made every edit a long rebuild.
[profile.dev.package.aria]
opt-level = 0

[profile.dev.package.aria-ui]
opt-level = 0

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
