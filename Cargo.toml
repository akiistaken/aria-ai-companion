[workspace]
resolver = "2"
members = ["aria", "aria-avatar", "aria-protocol"]
# The vendored msedge-tts is a patched dependency, not one of our crates.
exclude = ["vendor/msedge-tts"]

[profile.dev]
opt-level = 1
# Usable backtraces, far less debug info to write on Windows.
debug = "line-tables-only"

# Dependencies (Bevy especially) need optimisation to run smoothly even in dev builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The app crate is mostly Slint-generated UI code plus light glue. Optimising it bought nothing
# at runtime but made every `.slint` edit a ~2 minute rebuild.
[profile.dev.package.aria]
opt-level = 0

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
