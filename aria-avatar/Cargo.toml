[package]
name = "aria-avatar"
version = "6.0.0"
edition = "2021"
description = "Aria avatar renderer: native VRM 1.0 stage in its own transparent window"

[dependencies]
# Lean Bevy: only what a VRM stage needs. No audio, no UI, no gamepads, no scenes.
bevy = { version = "0.20", default-features = false, features = [
  "bevy_render",
  "bevy_window",
  "bevy_asset",
  "bevy_gltf",
  "bevy_animation",
  "bevy_curve",
  "bevy_mesh",
  "bevy_shader",
  "bevy_pbr",
  "bevy_log",
  "bevy_winit",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_light",
  "bevy_image",
  "bevy_color",
  "bevy_mikktspace",
  "bevy_state",
  "png",
  "tonemapping_luts",
  "zstd_rust",
  "multi_threaded",
  "std",
  "debug",
  "default_app",
  "default_platform",
] }
bevy_vrm1 = { version = "0.11", features = ["log"] }
aria-protocol = { path = "../aria-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  # Local time for the `auto` lighting preset. `aria` already enables it on the same crate, so
  # workspace builds compile `windows` once either way.
  "Win32_System_Time",
] }
