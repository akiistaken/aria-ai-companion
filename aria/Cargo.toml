[package]
name = "aria"
version = "6.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Aria - autonomous desktop companion (Rust + Slint port)"

[dependencies]
aria-protocol = { workspace = true }
aria-ui = { workspace = true }
slint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

regex = "1"
rand = "0.9"
# Already in the tree through async-openai; replaces a hand-rolled encoder.
base64 = "0.22"

# The AI endpoint: typed OpenAI-compatible client (chat completions, tool calls, reasoning effort,
# prompt-cache keys). `rustls-no-provider` reuses the process-wide `ring` provider installed in
# `main`, so no second crypto backend (aws-lc) is built.
# `byot` lets responses decode into our own lenient struct: OpenAI-compatible providers add fields
# and finish reasons (DeepSeek's `insufficient_system_resource`) the strict types would reject.
async-openai = { version = "0.43", default-features = false, features = [
  "chat-completion",
  "byot",
  "rustls-no-provider",
] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }

msedge-tts = { path = "../vendor/msedge-tts", default-features = false, features = ["blocking"] }
ureq = { version = "3", features = ["json"] }
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "symphonia-mp3",
  "symphonia-wav",
] }
cpal = "0.18"
wasapi = "0.27"
sysinfo = "0.40"
windows = { workspace = true, features = [
  # System media sessions (what is playing, from any app or browser tab).
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_System_JobObjects",
  "Win32_Media_Audio",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.18"
arboard = "3"
global-hotkey = "0.10"
md5 = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
aria-build = { workspace = true }
